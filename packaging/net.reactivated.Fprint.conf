<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  fpd serves fprintd's API (for System Settings' fingerprint enrollment).
  Root, which fpd runs as, may own the name; anyone may call it, because fpd
  decides per call from the caller's uid: users act for themselves, root for
  anyone.
-->
<busconfig>
  <policy user="root">
    <allow own="net.reactivated.Fprint"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.reactivated.Fprint"/>
  </policy>
</busconfig>
